/* v0.1.5：iPhone 主畫面滿版視覺、可橫向捲動的桌面、可拖曳圖示 */
html,body{background:#071a36!important;overscroll-behavior:none}
#app{background:#071a36}
.desktop-scroll{position:absolute;inset:0 0 var(--task) 0;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}

.ym-login-subtitle{font-weight:bold;font-size:18px;letter-spacing:3px;margin:0 0 5px;text-shadow:0 2px 2px #4b125b}

.ym-login-input{width:100%;height:34px;border:1px solid #50216b;border-radius:1px;background:white;color:#26334a;padding:5px 9px;font-size:15px;box-shadow:inset 1px 2px 3px #36304033;min-width:0}

.ym-login-checks input{accent-color:#fff5d6;flex:0 0 auto;width:15px;height:15px;margin:0}
.ym-login-button{display:block;align-self:center;border:1px solid #ecd5f8;border-radius:3px;min-width:125px;margin:7px 0 4px;padding:8px 20px;background:linear-gradient(#f6e9fa,#d6b3e4);box-shadow:inset 0 1px 0 white,0 2px 5px #32103d88;color:#57286d;font-weight:bold;font-size:14px}

.ym-login-foot{width:100%;max-width:300px;border-top:1px solid #d3a9dc88;margin-top:7px;padding-top:9px;text-align:center;color:#edd8f4;font-size:11px;line-height:1.6}
.ym-login-select{width:100%;max-width:286px;margin-top:4px;background:#f4eaf9;color:#422353;border:1px solid #ac79bd;border-radius:2px;padding:5px;font-size:12px}
.ym-login-message{min-height:17px;font-size:12px;font-weight:bold;text-align:center;color:#ffe5a4}
.ym-presence-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ym-signout{margin-left:auto;border:1px solid #9dbee4;background:linear-gradient(white,#e5eefc);color:#234b85;border-radius:4px;padding:4px 8px;font-size:12px}

@media(max-height:560px){.ym-login-emblem{height:65px}.ym-login-brand{font-size:47px}.ym-login-smile{width:44px;height:44px;font-size:29px}.ym-login-shell{padding:7px 14px}.ym-login-form{gap:3px}.ym-login-checks{margin:5px 0 2px}}

/* v0.1.9 - YIQI Talk themes */
.ytalk-theme-switch{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:10px 0 8px}
.ytalk-theme-btn{border:1px solid #8bbce3;background:linear-gradient(#fff,#dbedf8);color:#1c4f82;border-radius:16px;padding:5px 10px;font-size:12px;box-shadow:0 1px 2px #0001}
.ytalk-theme-btn.active{background:linear-gradient(#d9f4ff,#90d8ff);border-color:#4fa9d8;font-weight:700}
.ytalk-mark{display:grid;place-items:center;font-size:38px;width:64px;height:64px;border-radius:18px;background:linear-gradient(145deg,#f8fdff,#bee8fb);color:#1d6f9d;border:2px solid #f4fdff;box-shadow:0 10px 18px #1235}
.ytalk-brand{font-family:Arial,Tahoma,sans-serif;font-size:clamp(37px,7.5vw,56px);font-weight:900;letter-spacing:-2px;text-shadow:0 2px 3px #1135;color:#fff;line-height:1}
.ytalk-brand em{font-style:normal;color:#fff2a9}
.ym-login-shell.ytalk-theme-aqua{background:linear-gradient(155deg,#7dd1f4 0%,#338fca 42%,#14527c 100%)}
.ym-login-shell.ytalk-theme-pink{background:linear-gradient(155deg,#cc91df 0%,#8a4db2 42%,#5b2a77 100%)}
.ym-login-shell.ytalk-theme-black{background:linear-gradient(155deg,#6b7281 0%,#232734 42%,#0f1117 100%)}
.ytalk-pane,.ytalk-chat{--tp1:#c8ecff;--tp2:#eef8ff;--tb:#12549c;--line:#9fc7ed;--soft:#eaf3ff;--soft2:#d5eaff;--soft3:#eff8ff;--avatar:#dfedff;--bubble:#e4f0ff;--compose:#e2efff;--btnBorder:#b7ceeb;--btnText:#315a8f;--note:#e7f2ff;--noteText:#4a6483;--card:#f4f9ff;--track:#577491}
.ytalk-pane.ytalk-theme-aqua,.ytalk-chat.ytalk-theme-aqua{--tp1:#bfeeff;--tp2:#f2fbff;--tb:#0b5f8b;--line:#92cbe8;--soft:#e5f7ff;--soft2:#d2effc;--soft3:#f5fcff;--avatar:#d8f4ff;--bubble:#dff3ff;--compose:#e2f5ff;--btnBorder:#a5cfe3;--btnText:#215f80;--note:#e8f8ff;--noteText:#406f87;--card:#f4fbff;--track:#4d7388}
.ytalk-pane.ytalk-theme-pink,.ytalk-chat.ytalk-theme-pink{--tp1:#f0dafd;--tp2:#fff2ff;--tb:#8d2fa5;--line:#d39ee4;--soft:#faf0ff;--soft2:#efd9fb;--soft3:#fff7ff;--avatar:#fce9ff;--bubble:#f9e6ff;--compose:#f7ecff;--btnBorder:#dbb6e8;--btnText:#7d3d95;--note:#f9efff;--noteText:#7c5a8e;--card:#fff8ff;--track:#846693}
.ytalk-pane.ytalk-theme-black,.ytalk-chat.ytalk-theme-black{--tp1:#2f3745;--tp2:#465063;--tb:#f1f5fb;--line:#5f6979;--soft:#1b212b;--soft2:#2a3340;--soft3:#202733;--avatar:#3c4658;--bubble:#334155;--compose:#1f2732;--btnBorder:#576173;--btnText:#eef3fb;--note:#2a3340;--noteText:#d7dfeb;--card:#222b37;--track:#b7c2d3}
.ytalk-pane{background:var(--card)}
.ytalk-pane .messenger-hero{background:linear-gradient(120deg,var(--tp1),var(--tp2));border-color:var(--line)}
.ytalk-pane .messenger-hero strong,.ytalk-pane .small,.ytalk-chat .chat-banner strong{color:var(--tb)}
.ytalk-pane .buddy,.ytalk-pane .buddy-item{background:var(--card);border-bottom-color:color-mix(in srgb,var(--line) 55%, white)}
.ytalk-pane .buddy:hover{background:color-mix(in srgb,var(--tp1) 55%, white)}
.ytalk-pane .avatar,.ytalk-chat .avatar{background:var(--avatar);box-shadow:0 0 0 1px var(--line)}
.ytalk-pane .friend-notes{background:var(--note);color:var(--noteText)}
.ytalk-pane .invitation,.ytalk-pane .ignored-friend{background:var(--card);border-color:var(--line)}
.ytalk-chat{background:var(--soft)}
.ytalk-chat .chat-banner{background:var(--soft2);border-bottom-color:var(--line)}
.ytalk-chat .chat-banner small,.ytalk-chat .bubble-time{color:var(--track)}
.ytalk-chat .chat-log{background:linear-gradient(var(--card),var(--soft3))}
.ytalk-chat .bubble{background:var(--bubble);color:#17324f}
.ytalk-chat .me .bubble{background:#d7f1da;color:#21412d}
.ytalk-chat .chat-compose{background:var(--compose);border-top-color:var(--line)}
.ytalk-chat .chat-tools button,.ytalk-pane .buddy-tools button,.ytalk-pane .invitation button,.ytalk-pane .ignored-friend button,.ytalk-pane .ym-signout{border:1px solid var(--btnBorder);background:linear-gradient(#fff,var(--soft3));border-radius:6px;color:var(--btnText);padding:5px 8px;font-size:12px}
.ytalk-chat .chat-compose input{border-color:var(--btnBorder)}
.ytalk-pane .ym-signout{margin-left:8px}

.xp-alerts .xp-alert button{pointer-events:auto}

.ytalk-svg{display:inline-block;width:27px;height:27px;vertical-align:middle;flex:none;filter:drop-shadow(0 2px 2px #001f4b55)}

.desktop-icon .icon-art .ytalk-svg{width:43px;height:43px}
.menu-entry i .ytalk-svg{width:26px;height:26px}
.titlebar>span:first-child .ytalk-svg{width:19px;height:19px;vertical-align:middle}
.task-app .ytalk-svg{width:21px;height:21px;margin-right:3px}
.xp-alert-head .ytalk-svg{width:18px;height:18px}
.ytalk-mark .ytalk-svg{width:70px;height:70px}
.ytalk-mark{background:linear-gradient(135deg,#e8faff,#b6e2ff);border:2px solid white}
.ytalk-heading{display:flex!important;align-items:center;gap:7px;font-size:clamp(15px,3.1vw,20px)!important;flex-wrap:wrap}
.ytalk-heading .ytalk-svg{width:28px;height:28px}
.ytalk-theme-switch{row-gap:7px}
.ytalk-pane .ytalk-friend-search-label{display:block;margin:12px 5px 4px;font-size:12px;color:var(--tb)}
.ytalk-pane .ytalk-friend-search{display:block;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fff;color:#1c3658;outline-offset:2px}

.ytalk-unread-count,.ytalk-task-unread{display:inline-grid;place-items:center;border-radius:999px;min-width:20px;height:20px;padding:0 5px;background:#ed5955;color:white;font-size:11px;font-weight:800;box-shadow:0 1px 2px #0003}
.ytalk-task-unread{margin-left:4px;min-width:18px;height:18px}
.ytalk-pane .buddy-item .buddy>span:nth-child(2){min-width:0;flex:1}
.ytalk-chat .chat-tools{flex-wrap:wrap}
.ytalk-chat .ytalk-typing{padding:7px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--track);background:var(--soft3)}
.ytalk-pane.ytalk-theme-black .buddy,.ytalk-pane.ytalk-theme-black .buddy small,.ytalk-pane.ytalk-theme-black .ignored-friend,.ytalk-pane.ytalk-theme-black .invitation{color:#e6edf7}
.ytalk-pane.ytalk-theme-black .buddy:hover{background:#30394a}
.ytalk-pane.ytalk-theme-black .ytalk-friend-search-label,.ytalk-pane.ytalk-theme-black .small{color:#e0edf8}
.ytalk-chat.ytalk-theme-black .bubble{color:#f1f7ff;background:#384963}
.ytalk-chat.ytalk-theme-black .bubble-wrap.me .bubble{background:#295c70;color:white}
.ytalk-chat.ytalk-theme-black .chat-compose input{color:#172d48;background:#fff}
.ytalk-chat.ytalk-theme-black .chat-compose .chat-tools button{background:#333f51;color:#e9f4ff}
.ytalk-pane.ytalk-theme-black .ym-signout,.ytalk-pane.ytalk-theme-black .buddy-tools button{background:#3e4c5f;color:#f3f7fc}
.ytalk-pane .ytalk-theme-btn.active,.ytalk-chat .ytalk-theme-btn.active{box-shadow:0 0 0 2px #ffffffaa,0 1px 4px #0002}
@media(max-width:700px){.ytalk-mark .ytalk-svg{width:59px;height:59px}.ytalk-presence-wrap{margin:7px 5px}.ytalk-pane .ym-presence-line{display:flex;flex-wrap:wrap;align-items:center;gap:3px}}


/* v0.2.1：YIQI Talk 狀態及最小化未讀提示 */
.ytalk-buddy-status{display:inline-block;font-size:15px;vertical-align:middle;margin-left:4px}
.ytalk-buddy-status.online{color:#26a965}
.ytalk-buddy-status.offline{color:#9a9fac}
.ytalk-buddy-status.busy{color:#df9233}
.ytalk-buddy-label{display:inline;font-size:11px;margin-left:2px;color:var(--track,#627b99)}
.ytalk-pane .buddy-item:has(.ytalk-buddy-status.offline) .buddy{opacity:.78}
.task-app .ytalk-task-unread{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;border-radius:13px;background:#e0374f;color:white;padding:0 4px;font-size:11px;font-weight:700;margin-left:5px}

/* v0.2.3 window management: resizable windows + touch drag + arrange/show desktop */
.window{isolation:isolate}
.window-resize-grip{position:absolute;right:0;bottom:0;width:29px;height:29px;border:0;background:linear-gradient(135deg,transparent 52%,#6c94bf 53%,#6c94bf 58%,transparent 59%,transparent 69%,#4f78ab 70%,#4f78ab 75%,transparent 76%);cursor:nwse-resize;touch-action:none;z-index:8;opacity:.92;user-select:none}
.window-resize-grip:active,.window-resize-grip:hover{background-color:#d8eaff99}
.window.maximized .window-resize-grip{display:none}
.window-tools-btn{flex:none;border:1px solid #a9c9f2;border-radius:4px;margin:5px 3px 5px 0;color:#fff;background:linear-gradient(#5198e6,#2169c5);font-size:12px;font-weight:700;padding:3px 8px;white-space:nowrap}
.window-tools-btn[aria-expanded="true"]{background:linear-gradient(#174e9d,#327cd7)}
.window-tools-panel{position:absolute;z-index:1200;bottom:calc(var(--task) + 8px);right:70px;width:min(245px,calc(100vw - 22px));background:#f9fbff;border:2px solid #2965b8;box-shadow:0 7px 20px #071d5266;border-radius:7px;overflow:hidden;padding:5px}
.window-tools-panel strong{display:block;padding:8px 10px;color:#fff;background:linear-gradient(#4587e5,#1b58ba);font-size:13px}
.window-tools-panel button{display:block;background:transparent;color:#22416d;border:0;border-radius:4px;text-align:left;width:100%;padding:11px 10px;font-size:13px}
.window-tools-panel button:hover,.window-tools-panel button:focus-visible{background:#dcecff}
@media(max-width:700px){
 .window:not(.maximized){left:var(--win-left,5px)!important;top:var(--win-top,7px)!important;width:min(var(--win-width,calc(100vw - 10px)),calc(100vw - 10px))!important;height:min(var(--win-height,calc(100% - var(--task) - 12px)),calc(100% - 8px))!important;max-height:calc(100% - 8px)}
 .window-tools-btn{font-size:16px;padding:2px 7px}
 .window-tools-panel{right:9px;bottom:calc(var(--task) + 6px)}
}


/* v0.2.4：關機／重新啟動前的模擬程式未關閉提醒。 */
.shutdown-warning{width:min(475px,96vw)}
.shutdown-warning .dialog-inner{padding:18px;text-align:left}
.shutdown-warning-title{display:block;color:#193e72;font-size:16px;line-height:1.45}
.shutdown-warning-desc{font-size:13px;line-height:1.6;margin:9px 0}
.shutdown-warning-list{list-style:none;margin:10px 0;padding:6px 9px;max-height:min(195px,28vh);overflow-y:auto;background:#f5f9ff;border:1px solid #a3c1e9;border-radius:7px;color:#213858}
.shutdown-warning-list li{padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #d7e4f5;font-size:13px;overflow-wrap:anywhere}
.shutdown-warning-list li:last-child{border-bottom:0}
.shutdown-warning-list small{font-size:11px;color:#647d9c;flex-shrink:0}
.shutdown-warning-note{font-size:12px;color:#466284;line-height:1.6;margin:12px 0}
.shutdown-warning-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.shutdown-warning-actions button{flex:1;min-width:125px}


/* v0.2.5 — stabilize mobile/landscape geometry; no new applications or features. */
.desktop{--sim-desktop-width:760px}
.desktop-workspace,.taskbar-track{width:max(100%,var(--sim-desktop-width))}
.desktop-workspace .window{max-height:calc(100% - 10px)}
.desktop-workspace .window.maximized{left:var(--max-left,0px)!important;top:0!important;width:min(100%,100vw)!important;height:100%!important;max-height:100%!important}
@media(max-width:700px){
 .desktop-workspace .window:not(.maximized){max-height:calc(100% - 10px);height:min(var(--win-height,calc(100% - 14px)),calc(100% - 10px))!important}
}
.dialog{max-height:calc(100% - 18px);display:flex;flex-direction:column}
.dialog-inner{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dialog-cover{padding:8px}

/* v0.3.3: Refit shortcuts and window geometry after wake when orientation
   changed during standby. Preserve the existing DOM and unsaved contents. */
/* v0.3.2: Reflow shortcuts on viewport rotation; user-placed positions remain
   memorized for return to the original orientation. No new functionality. */
/* v0.3.1: Keep maximized / arranged / reset windows within the currently visible
   horizontal desktop slice on narrow screens. No additional applications. */
/* v0.2.6: existing notepad unsaved-draft confirmation; no additional apps */
.note-warning-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.note-warning-actions button{font-size:13px;min-height:38px;white-space:normal}
@media(max-height:500px){.dialog-cover{overflow-y:auto;align-items:start}.dialog{margin:auto}.shutdown-warning .dialog-inner{padding:12px}}

/* YIQI XP v0.5.1 軟體中心穩定性修正；下載中心僅啟用經審核、可操作的本地網頁程式 */
.software-center,.software-utility{overflow-y:auto;min-height:0;height:100%;box-sizing:border-box}
.software-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:12px;margin:14px 0}
.software-card{padding:14px;border:1px solid #b4cceb;border-radius:8px;background:linear-gradient(#fefeff,#e9f3ff);color:#1a3b64;box-shadow:0 2px 6px #0c3e7914}
.software-card-heading{display:flex;gap:10px;align-items:center}.software-bigicon{font-size:32px;flex:0 0 38px}
.software-card-actions{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:13px}.software-card-actions button{padding:8px 10px}
.software-installed{font-size:12px;color:#166b39;font-weight:700;margin-right:auto}
.software-sticky{display:block;width:100%;min-height:170px;height:min(52vh,360px);resize:vertical;box-sizing:border-box;border:1px solid #e9b44e;background:linear-gradient(#fff7af,#fff2a2);padding:12px;font-size:16px;line-height:1.6;border-radius:4px;color:#3a310c}
.software-task-form{display:flex;gap:7px;flex-wrap:wrap}.software-task-form input{flex:1;min-width:140px;padding:10px;border:1px solid #91b4da;border-radius:5px}
.software-task-list{margin:12px 0;display:grid;gap:8px}.software-task-row{border:1px solid #c6d9ef;border-radius:5px;background:#fff;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px}
.software-task-row label{display:flex;gap:7px;align-items:center;min-width:0;overflow-wrap:anywhere}.software-task-done{text-decoration:line-through;color:#888}
.software-timer-display{font-size:clamp(34px,8vw,68px);font-weight:800;color:#1450a0;letter-spacing:3px;text-align:center;font-variant-numeric:tabular-nums;margin:13px 0}
.software-timer-choose,.software-timer-buttons{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:9px;margin:12px 0}
.software-timer-choose select{padding:8px;border:1px solid #9cbde2;border-radius:6px}.software-timer-buttons button{padding:8px 12px}

/* v0.6.3 個人磁碟：iPhone 友善的資料夾、文件、捷徑管理 */
.personal-toolbar{flex-wrap:wrap;gap:5px;padding:7px}.personal-toolbar button,.personal-import-button,.personal-backup-bar button{border:1px solid #9db8d9;border-radius:5px;background:linear-gradient(#fff,#e4eefc);padding:7px 9px;color:#234c7c;font-size:12px;cursor:pointer;white-space:nowrap}

.personal-import-button{display:inline-flex;align-items:center}.personal-explorer-grid{grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px;padding:10px;align-content:start}

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), app=$('#app');
const KEYS={settings:'yiqiRetro.settings.v1',files:'yiqiRetro.files.v1',bin:'yiqiRetro.bin.v1',chat:'yiqiRetro.chat.v1'};
// 個人資料獨立於模擬系統暫存，重新開機不會清除。
const PERSONAL_KEY='yiqiRetro.personal.v1';
// 唯一可跨模擬重新開機保留的設定：是否顯示『跳過開機動畫』按鈕。
const BOOT_SKIP_KEY='yiqiRetro.skipBootAnimation.v1';
const safe=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(key,def)=>{try{const v=JSON.parse(localStorage.getItem(key));return v==null?def:v}catch{return def}};
const store=(key,v)=>{try{localStorage.setItem(key,JSON.stringify(v));return true}catch{toast('瀏覽器儲存空間不可用，這次的內容可能無法保留。');return false}};
const defaults={name:'億柒訪客',wallpaper:'yiqi',sound:true,chatSound:true,musicSound:true,startupSound:true,shutdownSound:true,muted:false,volume:65,fast:false,skip:true};
function readBootSkipPreference(){
  try{
    const saved=localStorage.getItem(BOOT_SKIP_KEY);
    if(saved==='true'||saved==='false')return saved==='true';
    // 第一次升級時沿用上一版本剛設定的值，不丟失使用者的選擇。
    const legacy=load(KEYS.settings,null);
    if(legacy&&typeof legacy.skip==='boolean')return legacy.skip;
  }catch(e){}
  return defaults.skip;
}
function writeBootSkipPreference(value){try{localStorage.setItem(BOOT_SKIP_KEY,String(!!value))}catch(e){}}

const factoryFiles=[{id:'welcome',name:'歡迎使用.txt',folderId:'docs',kind:'text',content:'歡迎使用 YIQI XP／億柒懷舊系統！\n\n這是獨立製作的網頁版懷舊模擬電腦，不是真正的 Windows。\n\n你可以使用我的電腦新增資料夾、整理文件與已安裝的軟體捷徑。\n\n資料夾、已儲存文件、軟體安裝紀錄會保留；桌布、聊天與暫時狀態在重新開機後會恢復預設。重要資料請定期匯出備份。'}];
const baseFolders=[{id:'docs',name:'我的文件',parentId:'root',system:true},{id:'programs',name:'我的軟體',parentId:'root',system:true}];
function freshPersonalData(){return {version:1,folders:baseFolders.map(f=>({...f})),files:factoryFiles.map(f=>({...f})),bin:[],installed:[],shortcutFolders:{}}}
function validPersonalData(x){return !!x&&typeof x==='object'&&Array.isArray(x.folders)&&Array.isArray(x.files)&&Array.isArray(x.bin)&&Array.isArray(x.installed)&&x.shortcutFolders&&typeof x.shortcutFolders==='object'}
let personalData=load(PERSONAL_KEY,null);
if(!validPersonalData(personalData))personalData=freshPersonalData();
// 舊版過渡：將尚未關機的文字文件加入個人磁碟，避免第一次升級便丟失。
let hadSavedPersonalData=false;try{hadSavedPersonalData=!!localStorage.getItem(PERSONAL_KEY)}catch(e){}
if(!hadSavedPersonalData){
 const oldFiles=load(KEYS.files,null);
 if(Array.isArray(oldFiles)&&oldFiles.length)personalData.files=oldFiles.filter(f=>f&&typeof f.name==='string').map((f,i)=>({...f,id:f.id||'legacy_'+i,folderId:'docs',kind:'text'}));
}
let folders=personalData.folders,shortcutFolders=personalData.shortcutFolders;
let cfg={...defaults,...load(KEYS.settings,defaults),skip:readBootSkipPreference()},files=personalData.files,bin=personalData.bin,chats=load(KEYS.chat,{});
if(!chats||typeof chats!=='object')chats={};
function savePersonalData(){
 personalData={version:1,folders,files,bin,installed:[...installedSoftware],shortcutFolders};
 return store(PERSONAL_KEY,personalData);
}
function newItemId(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function refreshFileWindows(){
 for(const w of wins.filter(w=>w.app==='explorer'||w.app==='documents'||w.app==='bin')){
  // 最小化視窗不直接重新產生 DOM；下一次還原時才更新，避免看到已刪除的資料夾。
  if(w.minimized)w.needsRefresh=true;
  else refresh(w);
 }
}
function folderLabel(id){if(id==='root')return '本機磁碟 (C:)';if(id==='desktop')return '桌面';return folders.find(f=>f.id===id)?.name||'未知資料夾'}
function folderPath(id){let path=[folderLabel(id)],now=id,n=0;while(now!=='root'&&now!=='desktop'&&n++<40){const p=folders.find(f=>f.id===now)?.parentId;if(!p)break;path.unshift(folderLabel(p));now=p}return path.join(' › ')}
function fileKind(f){return f.kind||'text'}
function isSystemFolder(id){return id==='root'||id==='desktop'||folders.some(f=>f.id===id&&f.system)}
function folderExists(id){return id==='root'||id==='desktop'||folders.some(f=>f.id===id)}
function folderChildren(id){return folders.filter(f=>f.parentId===id)}
// 檔案總管視窗專屬的暫時導覽紀錄，避免與 Safari 的網頁上一頁混淆。
function currentExplorerFolder(w){return folderExists(w?.arg)?w.arg:(w?.app==='documents'?'docs':'root')}
function navigateExplorer(w,target){
 if(!w||!(w.app==='explorer'||w.app==='documents')||!folderExists(target))return;
 const old=currentExplorerFolder(w);
 if(old!==target){
  w.folderBack=[...(w.folderBack||[]),old].slice(-50);
  w.folderForward=[];
  w.arg=target;
 }
 refresh(w);activate(w.id);
}
function navigateExplorerHistory(w,direction){
 if(!w||!(w.app==='explorer'||w.app==='documents'))return;
 if(direction==='up'){
  const current=currentExplorerFolder(w);
  if(current==='root')return;
  const parent=current==='desktop'?'root':folders.find(f=>f.id===current)?.parentId||'root';
  navigateExplorer(w,folderExists(parent)?parent:'root');
  return;
 }
 const from=direction==='back'?'folderBack':'folderForward';
 const to=direction==='back'?'folderForward':'folderBack';
 const history=w[from]||[];
 while(history.length){
  const target=history.pop();
  if(!folderExists(target)||target===currentExplorerFolder(w))continue;
  w[to]=[...(w[to]||[]),currentExplorerFolder(w)].slice(-50);
  w.arg=target;
  refresh(w);activate(w.id);
  return;
 }
 refresh(w);
}
function normalizeExplorerWindows(){
 for(const w of wins.filter(w=>w.app==='explorer'||w.app==='documents')){
  if(!folderExists(w.arg)){
   // 先前所在資料夾已遭刪除／匯入備份覆蓋時，回到有效的起始資料夾。
   w.arg=w.app==='documents'?'docs':'root';
   w.folderBack=[];w.folderForward=[];
  }else{
   w.folderBack=(w.folderBack||[]).filter(folderExists);
   w.folderForward=(w.folderForward||[]).filter(folderExists);
  }
 }
}
function refreshPersonalUI(){normalizeExplorerWindows();syncInstalledShortcuts();renderShortcutIcons();renderStart();refreshFileWindows();redrawSoftwareCenter()}

let standbyViewport=null,state='off',epoch=0,activeId=null,wins=[],nextZ=20,showStart=false,powerDialog=false,powerWarningMode=null,noteClosePendingId=null,noteDrafts={},tipTimer=0,clockTimer=0,audioCtx=null,melodyTimer=null,melodyIndex=0,melodyTrack=0,paintStroke=false,volumeOpen=false,networkOpen=false,windowToolsOpen=false;
let desktopIconPositions={},suppressIconClick=false,lastDesktopTapId=null,lastDesktopTapAt=0,ignoredFriends=new Set(),pendingInvites=[],alerts=[],alertNumber=0,simEventsStarted=false;

let ymSession={signedIn:false,account:'',remembered:'yiqi_guest',remember:true,auto:false,invisible:false,presence:'online',pending:false,theme:'aqua',seq:0};

function talkIcon(){return `<svg class="ytalk-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><path d="M13 8h26c7 0 12 5 12 12v15c0 7-5 12-12 12H25L14 56v-9C7 45 4 40 4 34V20C4 13 8 8 13 8Z" fill="#0b65b7" stroke="#e8fbff" stroke-width="2.7" stroke-linejoin="round"/><path d="M21 15h28c6 0 11 5 11 11v14c0 6-5 11-11 11h-6l-3 7-10-7h-9c-6 0-11-5-11-11V26c0-6 5-11 11-11Z" fill="#f6fdff" stroke="#408dd5" stroke-width="2.7" stroke-linejoin="round"/><path d="M16 19c2-2 6-2 9-2h23c5 0 9 3 9 7" fill="none" stroke="#b6e8ff" stroke-width="2.5" stroke-linecap="round"/><circle cx="27" cy="33" r="3.2" fill="#2b86d5"/><circle cx="36" cy="33" r="3.2" fill="#2b86d5"/><circle cx="45" cy="33" r="3.2" fill="#2b86d5"/></svg>`}
// 所有軟體都是本網站內建、可真正操作的安全網頁程式。安裝只是啟用捷徑；不執行外部 .exe 或任意 JavaScript。
const softwareCatalog=[
 {id:'sticky',name:'便利貼',icon:'🗒️',description:'在桌面視窗輸入備忘文字，待命後繼續編輯'},
 {id:'timer',name:'倒數計時器',icon:'⏱️',description:'選擇分鐘數、開始、暫停與重設，時間到會提示'},

];
let installedSoftware=new Set(personalData.installed.filter(id=>softwareCatalog.some(x=>x.id===id)));
const blankSoftwareState=()=>({sticky:'',todoDraft:'',tasks:[],timer:{duration:300,remaining:300,endAt:null,doneNotified:false}});
let softwareState=blankSoftwareState(),softwareTimerInterval=null,softwareTimerResumeOnWake=false;
function stopSoftwareTimerPolling(){
 if(softwareTimerInterval!==null){clearInterval(softwareTimerInterval);softwareTimerInterval=null}
}
function resetSoftwareSession(){
 installedSoftware=new Set(personalData.installed.filter(id=>softwareCatalog.some(x=>x.id===id)));softwareState=blankSoftwareState();softwareTimerResumeOnWake=false;
 stopSoftwareTimerPolling();
 syncInstalledShortcuts();
}
function softwareRemaining(){
 const t=softwareState.timer;
 return t.endAt===null?t.remaining:Math.max(0,Math.ceil((t.endAt-Date.now())/1000));
}
function timerText(seconds){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function tickSoftwareTimer(){
 const t=softwareState.timer;
 if(t.endAt!==null&&softwareRemaining()===0){
  t.endAt=null;t.remaining=0;
  if(!t.doneNotified&&state==='desktop'){
   t.doneNotified=true;
   toast('⏱️ 倒數計時結束！');chirp(880,.20);
  }
 }

 if(stateLabel)stateLabel.textContent=t.endAt!==null?'倒數中':softwareRemaining()===0?'時間已到':'已暫停／待開始';
 // No background polling after countdown completes, pauses or resets.
 if(t.endAt===null)stopSoftwareTimerPolling();
}

function pauseSoftwareForStandby(){
 const t=softwareState.timer;

 if(softwareTimerResumeOnWake){t.remaining=softwareRemaining();t.endAt=null;}

}

 const t=softwareState.timer;
 if(softwareTimerResumeOnWake&&t.remaining>0){t.endAt=Date.now()+t.remaining*1000;ensureSoftwareTimer();}

function applyWindowGeometry(w){

function arrangeWindows(mode){
 const ws=$('#desktop-workspace'),sc=$('#desktop-scroll');if(!ws||!sc)return;
 const list=wins.filter(w=>!w.minimized);if(!list.length){toast('目前沒有開啟中的視窗');return}
 const mobile=sc.clientWidth<=700,viewLeft=sc.scrollLeft;
 const areaWidth=Math.max(290,Math.min(sc.clientWidth,ws.clientWidth));
 const areaHeight=Math.max(200,ws.clientHeight);
 let actualMode=mode;
 if(mode==='tile'){
  const columns=mobile?1:Math.min(2,list.length),rows=Math.ceil(list.length/columns),gap=8;
  // No point drawing narrow, unusable windows that disappear beneath the taskbar.
  if((areaHeight/rows-gap*2)<180||(areaWidth/columns-gap*2)<280){actualMode='cascade'}
  else{
   list.forEach((w,i)=>{
    const col=i%columns,row=Math.floor(i/columns),cw=Math.floor(areaWidth/columns),ch=Math.floor(areaHeight/rows);
    w.x=viewLeft+col*cw+gap;w.y=row*ch+gap;
    w.width=Math.min(cw-gap*2,Math.max(280,areaWidth-(w.x-viewLeft)-gap));
    w.height=Math.max(180,ch-gap*2);
    w.maximized=false;w.customPlacement=true;w.customSize=true;applyWindowGeometry(w);
   });
  }
 }
 if(actualMode==='cascade'){
  list.forEach((w,i)=>{
   const offsetX=Math.min(10+(i%7)*(mobile?16:31),Math.max(8,areaWidth-290));
   w.x=viewLeft+offsetX;
   w.y=Math.min(10+(i%7)*(mobile?18:28),Math.max(8,areaHeight-205));
   w.width=Math.min(mobile?Math.max(280,areaWidth-35):490,Math.max(280,areaWidth-offsetX-10));
   w.height=Math.min(440,Math.max(180,areaHeight-w.y-15));
   w.maximized=false;w.customPlacement=true;w.customSize=true;applyWindowGeometry(w);
  });
 }
 activate(list[list.length-1].id);
 toast(mode==='tile'&&actualMode==='cascade'?'螢幕空間不足，已改為視窗層疊':actualMode==='tile'?'已將視窗並排':'已將視窗層疊');
}

function resetDesktopWindowSizes(){
 const sc=$('#desktop-scroll');
 const left=sc?.scrollLeft||0,viewW=sc?.clientWidth||innerWidth,viewH=sc?.clientHeight||innerHeight;
 for(const w of wins){
  w.maximized=false;w.customPlacement=true;w.customSize=true;
  w.x=left+5;w.y=7;
  const naturalW=w.app==='messenger'?385:w.app==='chat'?480:w.app==='settings'?600:w.app==='paint'?720:w.app==='notepad'?590:640;
  const naturalH=w.app==='messenger'?645:w.app==='chat'?460:460;
  w.width=Math.max(280,Math.min(naturalW,viewW-10));
  w.height=Math.max(180,Math.min(naturalH,viewH-14));

function parseYoutubeVideo(input){
 const raw=String(input||'').trim();
 if(!raw||raw.length>2048)return null;
 if(/^[A-Za-z0-9_-]{11}$/.test(raw))return {id:raw,start:0};
 let u;
 try{u=new URL(raw)}catch{return null}
 if(u.protocol!=='https:'&&u.protocol!=='http:')return null;
 const host=u.hostname.toLowerCase();
 let id='';
 if(host==='youtu.be'||host==='www.youtu.be')id=u.pathname.split('/')[1]||'';
 else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)){
  const parts=u.pathname.split('/').filter(Boolean);
  if(parts[0]==='watch')id=u.searchParams.get('v')||'';
  else if(['shorts','live','embed','v'].includes(parts[0]))id=parts[1]||'';
 }else return null;
 if(!/^[A-Za-z0-9_-]{11}$/.test(id))return null;
 // 支援官方分享網址常見的秒數、1m30s 及 1h2m3s 格式。
 const time=u.searchParams.get('t')||u.searchParams.get('start')||u.searchParams.get('time_continue')||'0';
 let start=0;
 if(/^\d+$/.test(time))start=Number(time);
 else if(/^(?:(?:\d+)h)?(?:(?:\d+)m)?(?:(?:\d+)s)?$/i.test(time)&&/\d/.test(time)){
  const h=/(\d+)h/i.exec(time),m=/(\d+)m/i.exec(time),sec=/(\d+)s/i.exec(time);
  start=(h?Number(h[1])*3600:0)+(m?Number(m[1])*60:0)+(sec?Number(sec[1]):0);
 }
 return {id,start:Number.isFinite(start)?Math.min(86400,Math.max(0,Math.floor(start))):0};
}

// 個人模擬磁碟與資料夾（與關機重設的暫存狀態分離）。
function fsId(f){return f.id||f.name}
function nameAllowed(raw){return String(raw||'').trim().replace(/[\\/:*?"<>|\x00-\x1f]/g,'').slice(0,60)}
function folderTreeEntries(){return [{id:'desktop',label:'🖥️ 桌面'},{id:'root',label:'💽 C: 根目錄'},...folders.map(f=>({id:f.id,label:'📁 '+folderPath(f.id)}))]}
function descendantsOf(id){const all=new Set([id]);let changed=true;while(changed){changed=false;for(const f of folders)if(all.has(f.parentId)&&!all.has(f.id)){all.add(f.id);changed=true}}return all}
function canMoveFolder(id,to){return folderExists(to)&&!isSystemFolder(id)&&!descendantsOf(id).has(to)}
function createFolder(parent){
 if(!folderExists(parent))parent='docs';
 const raw=prompt('新增資料夾名稱','新增資料夾');if(raw===null)return;
 const name=nameAllowed(raw);if(!name){toast('請輸入資料夾名稱');return}
 if(folders.some(f=>f.parentId===parent&&f.name===name)){toast('此位置已有同名資料夾');return}
 folders.push({id:newItemId(),name,parentId:parent});if(!savePersonalData()){folders.pop();return}refreshPersonalUI();toast('已建立資料夾：'+name);
}
function renameFsItem(type,id){
 const item=type==='folder'?folders.find(f=>f.id===id):files.find(f=>fsId(f)===id);
 if(!item||type==='folder'&&isSystemFolder(id))return;
 if(type==='file'&&noteDrafts[item.name]!==undefined){toast('請先關閉或儲存正在編輯的文件');return}
 const raw=prompt('重新命名',item.name);if(raw===null)return;
 const name=nameAllowed(raw);if(!name)return toast('名稱不可空白');
 if(type==='folder'&&folders.some(f=>f!==item&&f.parentId===item.parentId&&f.name===name))return toast('已有同名資料夾');
 if(type==='file'&&files.some(f=>f!==item&&f.name===name))return toast('已有同名文件');
 const old=item.name;item.name=name;if(!savePersonalData()){item.name=old;personalData={version:1,folders,files,bin,installed:[...installedSoftware],shortcutFolders};toast('儲存失敗，名稱未更改');return}refreshPersonalUI();
 // 若檔名在記事本中已開啟，避免對錯誤檔案寫入。
 if(type==='file')for(const w of [...wins].filter(w=>w.app==='notepad'&&w.arg===old))closeWin(w.id,true)
}
function deleteFsItem(type,id){
 // 儲存失敗時必須還原記憶體中的異動，避免瀏覽器畫面和真正保存的資料不一致。
 const snapshot={folders:[...folders],files:[...files],bin:[...bin],shortcuts:{...shortcutFolders}};
 let affectedFiles=[];
 if(type==='file'){
  const idx=files.findIndex(f=>fsId(f)===id);if(idx<0)return;
  const target=files[idx];
  const editor=wins.find(w=>w.app==='notepad'&&noteFileName(w)===target.name);
  if(editor&&noteIsDirty(editor)&&!confirm('這份文件在記事本中有尚未儲存的修改。移到資源回收筒會捨棄這些修改，確定繼續嗎？'))return;
  affectedFiles=[target.name];
  bin=[...bin,{type:'file',item:target}];files=files.filter((_,i)=>i!==idx);
 }else if(type==='folder'){
  const item=folders.find(f=>f.id===id);if(!item||isSystemFolder(id))return;
  const all=descendantsOf(id),entries=folders.filter(f=>all.has(f.id));
  const related=files.filter(f=>all.has(f.folderId));
  const dirty=related.filter(f=>wins.some(w=>w.app==='notepad'&&noteFileName(w)===f.name&&noteIsDirty(w)));
  const suffix=dirty.length?'\n\n注意：其中有 '+dirty.length+' 份文件正在編輯且尚未儲存，刪除將捨棄這些草稿。':'';
  if(!confirm('要將「'+item.name+'」及其中 '+related.length+' 份文件一起移到資源回收筒嗎？'+suffix))return;
  affectedFiles=related.map(f=>f.name);
  const links={};for(const [k,v] of Object.entries(shortcutFolders))if(all.has(v)){links[k]=v;delete shortcutFolders[k]}
  folders=folders.filter(f=>!all.has(f.id));files=files.filter(f=>!all.has(f.folderId));
  bin=[...bin,{type:'folder',item:{folders:[item,...entries.filter(f=>f!==item)],files:related,shortcuts:links}}];
 }else return;
 if(!savePersonalData()){
  folders=snapshot.folders;files=snapshot.files;bin=snapshot.bin;shortcutFolders=snapshot.shortcuts;
  personalData={version:1,folders,files,bin,installed:[...installedSoftware],shortcutFolders};
  toast('儲存空間不足，刪除未生效；原有文件仍保留');return;
 }
 // 刪除成功後才關閉被刪除文件的檢視／編輯視窗，防止舊記事本另存回預設目錄。
 for(const w of [...wins].filter(w=>(w.app==='notepad'||w.app==='imageViewer')&&affectedFiles.includes(w.app==='notepad'?noteFileName(w):w.arg)))closeWin(w.id,true);
 refreshPersonalUI();toast('已移到資源回收筒');
}
function restoreFsItem(i){

 const previous={folders:[...folders],files:[...files],bin:[...bin],shortcuts:{...shortcutFolders}};
 if(entry.type==='folder'){
  const piece=entry.item;const first=piece?.folders?.[0];
  if(!first||!folderExists(first.parentId))return toast('上層資料夾不存在，暫時不能還原');
  // 回收筒還原必須保留資料夾位置的一致性，不能在同一層建立兩個同名資料夾。
  // 不同 ID 但同名同層同樣視為衝突，讓使用者先重新命名既有資料夾。
  if(piece.folders.some(f=>folders.some(x=>x.id===f.id||(x.parentId===f.parentId&&x.name===f.name)))||
     piece.files.some(f=>files.some(x=>x.name===f.name)))
   return toast('還原失敗：原位置已有同名資料夾或文件。請先重新命名現有項目');
  folders.push(...piece.folders);files.push(...piece.files);Object.assign(shortcutFolders,piece.shortcuts||{});
 }else{
  const file=entry.type==='file'?entry.item:entry;
  if(!file||files.some(f=>f.name===file.name))return toast('檔名重複，無法還原');
  let destination=file.folderId||'docs';

 const info=$('#player-track-style'),status=$('#player-status');
 if(btn)btn.textContent=melodyTimer!==null?'⏸ 暫停':'▶ 播放';
 if(disc)disc.classList.toggle('spinning',melodyTimer!==null);
 if(sel)sel.value=String(melodyTrack);
 if(info)info.textContent=songs[melodyTrack].style;
 if(status)status.textContent=melodyTimer!==null?'正在播放：'+songs[melodyTrack].name:'目前曲目：'+songs[melodyTrack].name+'（已暫停）';
}
function playMusic(){
 if(melodyTimer!==null){stopMusic();return}
 melodyIndex=0;
 function playStep(){
  const track=songs[melodyTrack];
  const [hz,beats]=track.notes[melodyIndex%track.notes.length];
  // 各曲使用不同拍長，換曲後立刻從第一個音重新開始。
  const milliseconds=60000/track.bpm*beats;
  if(hz){
   synthMusicNote(hz,Math.max(.085,milliseconds/1000-.035),track.wave,track.level);
   // 緩慢旋律加入低音襯底，與快節奏 8-bit 音色有明顯區別。
   if(track.bpm<=116&&melodyIndex%4===0)synthMusicNote(hz/2,Math.min(1.1,milliseconds/1000*1.3),'sine',track.level*.30);
  }
  melodyIndex++;
  melodyTimer=setTimeout(playStep,milliseconds);
 }
 playStep();updatePlayerUI();
}
function selectMusicTrack(index){
 const wasPlaying=melodyTimer!==null;
 stopMusic();
 melodyTrack=(Number(index)+songs.length)%songs.length;
 melodyIndex=0;
 if(wasPlaying)playMusic();
 else updatePlayerUI();
}
