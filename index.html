.xp-alert-head{background:linear-gradient(#5693ee,#1d58be);color:white;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;font-size:12px;font-weight:bold}

// 所有音訊均以 Web Audio 本機合成；非微軟原版音效或受保護歌曲。
function getAudioContext(){
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return null;
  audioCtx=audioCtx||new Audio();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});

 }catch{return null}

function canSound(channel){

function chirp(pitch=600,dur=.12,kind='sine',vol=.04,channel='system'){
 if(!canSound(channel))return;
 try{
  const ctx=getAudioContext();if(!ctx)return;

 }catch{}
}
// 獨立的開機/關機原創提示旋律，彼此不同，且可分別控制。
function playPowerSound(which,preview=false){
 if(cfg.muted||cfg.volume<=0)return;
 if(which!=='startup'&&which!=='shutdown')return;
 if(!preview&&!cfg[which+'Sound'])return;

  notes.forEach(([hz,delay,duration],i)=>{
   const o=ctx.createOscillator(),g=ctx.createGain(),start=ctx.currentTime+delay;
   o.type=i%2===0?'sine':'triangle';o.frequency.setValueAtTime(hz,start);
   g.gain.setValueAtTime(.0001,start);
   g.gain.linearRampToValueAtTime(level*(which==='startup'?1:.8),start+.07);
   g.gain.exponentialRampToValueAtTime(.0001,start+duration);
   o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+duration+.02);
  });
 }catch{}
}

function openWin(appId,arg){if(state!=='desktop')return;
 if(appId==='chat'&&!ymSession.signedIn){openWin('messenger');toast('請先登入億柒即時通（純模擬）');return;}showStart=false;renderStart();const key=appId==='chat'?'chat_'+arg:appId==='notepad'?'notepad_'+(arg||'個人筆記.txt'):appId;let w=wins.find(x=>x.id===key);if(w){w.minimized=false;activate(w.id);return}w={id:key,app:appId,arg,icon:appId==='chat'?'💬':apps[appId]?.[0]||'📄',title:'',minimized:false,maximized:false,z:++nextZ,x:Math.min(130+28*wins.length,Math.max(5,innerWidth-330)),y:Math.min(46+26*wins.length,Math.max(5,innerHeight-280)),width:appId==='messenger'?385:appId==='chat'?480:appId==='settings'?600:appId==='paint'?720:appId==='notepad'?590:640,height:appId==='chat'?460:appId==='calculator'?430:appId==='messenger'?645:appId==='notepad'?460:460};w.title=titleFor(w);wins.push(w);mountWindow(w);activate(w.id);chirp(660,.06);if(appId==='chat')setTimeout(()=>scrollChat(w.id),30)}
function mountWindow(w){const host=$('#windows');if(!host||w.minimized)return;let el=document.getElementById('win-'+w.id);if(!el){el=document.createElement('section');el.id='win-'+w.id;el.className='window';host.appendChild(el)}el.style.left=w.x+'px';el.style.top=w.y+'px';el.style.width=w.width+'px';el.style.height=w.height+'px';el.style.zIndex=String(w.z);el.classList.toggle('maximized',w.maximized);el.classList.toggle('inactive',activeId!==w.id);el.innerHTML=`<header class="titlebar" data-drag="${safe(w.id)}"><span>${w.icon}</span><span class="title-text">${safe(w.title)}</span><div class="win-actions"><button data-win="min" data-id="${safe(w.id)}" aria-label="最小化">—</button><button data-win="max" data-id="${safe(w.id)}" aria-label="最大化">${w.maximized?'❐':'□'}</button><button class="close" data-win="close" data-id="${safe(w.id)}" aria-label="關閉">×</button></div></header><div class="window-content">${getAppHtml(w)}</div>`;
if(w.app==='paint')requestAnimationFrame(()=>setupCanvas(w));if(w.app==='chat')requestAnimationFrame(()=>scrollChat(w.id));if(w.app==='player')updatePlayerUI()}
function activate(id){const w=wins.find(x=>x.id===id);if(!w)return;w.z=++nextZ;w.minimized=false;activeId=id;const el=document.getElementById('win-'+id);if(!el)mountWindow(w);wins.forEach(v=>{const e=document.getElementById('win-'+v.id);if(e){e.style.zIndex=String(v.z);e.classList.toggle('inactive',v.id!==id)}});renderTasks()}
function closeWin(id){
 if(id==='messenger'&&ymSession.signedIn&&!ymSession.auto){
  // 若未勾選自動登入，關閉即時通會退出這次模擬工作階段。
  ymSession.seq++;ymSession.signedIn=false;ymSession.pending=false;
  simEventsStarted=false;pendingInvites=[];alerts=[];renderAlerts();
  for(const chat of wins.filter(w=>w.app==='chat')){document.getElementById('win-'+chat.id)?.remove()}
  wins=wins.filter(w=>w.app!=='chat');
 }
 wins=wins.filter(w=>w.id!==id);document.getElementById('win-'+id)?.remove();if(id==='player')stopMusic();if(activeId===id)activeId=wins.length?wins[wins.length-1].id:null;if(activeId)activate(activeId);else renderTasks()}
function toggleTask(id){const w=wins.find(v=>v.id===id);if(!w)return;const el=document.getElementById('win-'+id);if(!w.minimized&&activeId===id){w.minimized=true;el?.remove();activeId=null;renderTasks()}else{w.minimized=false;mountWindow(w);activate(id)}}

function mockYmSignIn(form){
 if(ymSession.pending||state!=='desktop')return;
 const name=(form.elements.mockAccount.value||'').trim();
 if(!name){form.querySelector('#ym-id')?.focus();return;}
 ymSession.remember=!!form.elements.remember.checked;
 ymSession.remembered=ymSession.remember?name:'';
 ymSession.auto=!!form.elements.auto.checked;
 ymSession.invisible=!!form.elements.invisible.checked;
 ymSession.pending=true;
 const w=wins.find(w=>w.app==='messenger');refresh(w);
 const session=epoch, token=++ymSession.seq;
 // 模擬登入的延遲是介面動畫，不進行任何網路請求。
 setTimeout(()=>{
  if(epoch!==session||ymSession.seq!==token||state!=='desktop')return;
  ymSession.account=name;ymSession.signedIn=true;ymSession.pending=false;
  chirp(700,.10);setTimeout(()=>chirp(890,.15),120);
  refresh(wins.find(w=>w.app==='messenger'));
  showAlert('online','已登入億柒即時通',`${name}，歡迎回到懷舊聊天室！`);
  if(!simEventsStarted)scheduleSimEvents();
 },800);
}
function mockYmSignOut(){
 ymSession.seq++;ymSession.signedIn=false;ymSession.pending=false;ymSession.auto=false;
 simEventsStarted=false;pendingInvites=[];alerts=[];renderAlerts();

 refresh(wins.find(w=>w.app==='messenger'));
 toast('已登出模擬即時通，Windows 桌面仍保持開啟');
}

const activeMusicOscillators=new Set();
function synthMusicNote(hz, duration, wave, loudness){
 if(!hz||!canSound('music'))return;
 try{
  const ctx=getAudioContext();if(!ctx)return;

  osc.connect(gain);gain.connect(ctx.destination);
  activeMusicOscillators.add(osc);
  osc.onended=()=>{activeMusicOscillators.delete(osc);try{osc.disconnect();gain.disconnect()}catch(e){}};
  osc.start(start);osc.stop(start+release+.03);
 }catch(e){}
}

function playMusic(){

  const track=songs[melodyTrack];
  const [hz,beats]=track.notes[melodyIndex%track.notes.length];
  // 各曲使用不同拍長，換曲後立刻從第一個音重新開始。
  const milliseconds=60000/track.bpm*beats;

}

 const id=icon.dataset.shortcut,index=desktopShortcuts.findIndex(a=>a[0]===id),pos=shortcutPosition(id,index),sx=e.clientX,sy=e.clientY;
 let holding=false,moved=false,cancelled=false;
 const timer=setTimeout(()=>{if(cancelled)return;holding=true;icon.classList.add('moving');try{icon.setPointerCapture(e.pointerId)}catch{}},220);
 function move(ev){
  const dx=ev.clientX-sx,dy=ev.clientY-sy;
  if(!holding){if(Math.abs(dx)+Math.abs(dy)>15){cancelled=true;clearTimeout(timer)}return}
  moved=true;
  const x=Math.max(0,Math.min(ws.clientWidth-icon.offsetWidth,pos.x+dx));
  const y=Math.max(0,Math.min(ws.clientHeight-icon.offsetHeight,pos.y+dy));
  desktopIconPositions[id]={x,y};icon.style.left=x+'px';icon.style.top=y+'px';
 }
 function end(){clearTimeout(timer);icon.classList.remove('moving');if(holding){suppressIconClick=true;setTimeout(()=>{suppressIconClick=false},400)}icon.removeEventListener('pointermove',move);icon.removeEventListener('pointerup',end);icon.removeEventListener('pointercancel',end)}
 icon.addEventListener('pointermove',move);icon.addEventListener('pointerup',end);icon.addEventListener('pointercancel',end);
});
app.addEventListener('pointerdown',e=>{if(state!=='desktop')return;const bar=e.target.closest('[data-drag]');if(!bar||e.target.closest('.win-actions'))return;const id=bar.dataset.drag,w=wins.find(v=>v.id===id);if(!w)return;activate(id);if(w.maximized||innerWidth<=700)return;const el=document.getElementById('win-'+id);const sx=e.clientX,sy=e.clientY,ox=w.x,oy=w.y;bar.setPointerCapture(e.pointerId);function move(ev){w.x=Math.max(0,Math.min(innerWidth-100,ox+ev.clientX-sx));w.y=Math.max(0,Math.min(innerHeight-100,oy+ev.clientY-sy));el.style.left=w.x+'px';el.style.top=w.y+'px'}function up(){bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up)}bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up)});
app.addEventListener('dblclick',e=>{if(e.target.closest('.titlebar')&&!e.target.closest('.win-actions')){const id=e.target.closest('.window')?.id.slice(4);if(id)windowAction('max',id)}});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(powerDialog){powerDialog=false;renderDialog()}else if(showStart){showStart=false;renderStart()}}});
powerOffScreen();
})();
</script>
