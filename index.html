// 所有音訊均以 Web Audio 本機合成；非微軟原版音效或受保護歌曲。
function getAudioContext(){
 try{
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)return null;
  audioCtx=audioCtx||new Audio();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  return audioCtx;
 }catch{return null}
}
function canSound(channel){
 if(cfg.muted||cfg.volume<=0)return false;

}
function chirp(pitch=600,dur=.12,kind='sine',vol=.04,channel='system'){
 if(!canSound(channel))return;
 try{
  const ctx=getAudioContext();if(!ctx)return;
  const o=ctx.createOscillator(),g=ctx.createGain(),start=ctx.currentTime;
  o.type=kind;o.frequency.value=pitch;
  g.gain.setValueAtTime(Math.max(.0001,Math.min(.15,vol*(cfg.volume/65))),start);
  g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+dur+.01);
 }catch{}
}
// 專屬 YIQI Talk 來訊雙音提示；獨立於一般系統音效，遵守主音量及靜音。
function playTalkMessageSound(preview=false){
 if(cfg.muted||cfg.volume<=0||(!preview&&!cfg.chatSound))return;
 try{
  const ctx=getAudioContext();if(!ctx)return;
  [[880,0,.13],[1174.66,.145,.19]].forEach(([hz,delay,duration])=>{
   const osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime+delay;
   osc.type='sine';osc.frequency.setValueAtTime(hz,t);
   gain.gain.setValueAtTime(.0001,t);
   gain.gain.linearRampToValueAtTime(.032*cfg.volume/65,t+.022);
   gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
   osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+duration+.02);
  });
 }catch(e){}
}

// 獨立的開機/關機原創提示旋律，彼此不同，且可分別控制。
function playPowerSound(which,preview=false){
 if(cfg.muted||cfg.volume<=0)return;
 if(which!=='startup'&&which!=='shutdown')return;
 if(!preview&&!cfg[which+'Sound'])return;
 try{
  const ctx=getAudioContext();if(!ctx)return;
  // 開機：上升的溫暖和弦；關機：下降的柔和收尾。
  const notes=which==='startup'
   ? [[392,0,.36],[493.88,.18,.42],[587.33,.40,.52],[783.99,.68,.76],[987.77,.78,.80]]
   : [[659.25,0,.38],[523.25,.26,.44],[392,.57,.52],[261.63,.91,.72]];
  const level=Math.min(.052,.024*cfg.volume/65);
  notes.forEach(([hz,delay,duration],i)=>{
   const o=ctx.createOscillator(),g=ctx.createGain(),start=ctx.currentTime+delay;
   o.type=i%2===0?'sine':'triangle';o.frequency.setValueAtTime(hz,start);
   g.gain.setValueAtTime(.0001,start);
   g.gain.linearRampToValueAtTime(level*(which==='startup'?1:.8),start+.07);
   g.gain.exponentialRampToValueAtTime(.0001,start+duration);
   o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+duration+.02);
  });
 }catch{}
}

function bindDesktopHorizontalScroll(){

 if(!desktopScroll||!taskbarWrap)return;

// Reflow desktop shortcuts when rotating between portrait and landscape.
// Keep user-defined positions in memory; temporarily clamp only their display

function fitDesktopIconsToViewport(){

 document.querySelectorAll('.desktop-icon[data-shortcut]').forEach(icon=>{
  const id=icon.dataset.shortcut,index=desktopShortcuts.findIndex(a=>a[0]===id);

function applyWindowGeometry(w){

 if(w.customPlacement){el.style.setProperty('--win-left',w.x+'px');el.style.setProperty('--win-top',w.y+'px')}
 else{el.style.removeProperty('--win-left');el.style.removeProperty('--win-top')}
 if(w.customSize){el.style.setProperty('--win-width',w.width+'px');el.style.setProperty('--win-height',w.height+'px')}

function arrangeWindows(mode){
 const ws=$('#desktop-workspace'),sc=$('#desktop-scroll');if(!ws||!sc)return;
 const list=wins.filter(w=>!w.minimized);if(!list.length){toast('目前沒有開啟中的視窗');return}
 const mobile=sc.clientWidth<=700,viewLeft=sc.scrollLeft;
 const areaWidth=Math.max(290,Math.min(sc.clientWidth,ws.clientWidth));
 const areaHeight=Math.max(200,ws.clientHeight);
 let actualMode=mode;
 if(mode==='tile'){
  const columns=mobile?1:Math.min(2,list.length),rows=Math.ceil(list.length/columns),gap=8;
  // No point drawing narrow, unusable windows that disappear beneath the taskbar.
  if((areaHeight/rows-gap*2)<180||(areaWidth/columns-gap*2)<280){actualMode='cascade'}
  else{
   list.forEach((w,i)=>{
    const col=i%columns,row=Math.floor(i/columns),cw=Math.floor(areaWidth/columns),ch=Math.floor(areaHeight/rows);
    w.x=viewLeft+col*cw+gap;w.y=row*ch+gap;
    w.width=Math.min(cw-gap*2,Math.max(280,areaWidth-(w.x-viewLeft)-gap));
    w.height=Math.max(180,ch-gap*2);
    w.maximized=false;w.customPlacement=true;w.customSize=true;applyWindowGeometry(w);
   });
  }
 }
 if(actualMode==='cascade'){
  list.forEach((w,i)=>{
   const offsetX=Math.min(10+(i%7)*(mobile?16:31),Math.max(8,areaWidth-290));
   w.x=viewLeft+offsetX;
   w.y=Math.min(10+(i%7)*(mobile?18:28),Math.max(8,areaHeight-205));
   w.width=Math.min(mobile?Math.max(280,areaWidth-35):490,Math.max(280,areaWidth-offsetX-10));
   w.height=Math.min(440,Math.max(180,areaHeight-w.y-15));
   w.maximized=false;w.customPlacement=true;w.customSize=true;applyWindowGeometry(w);
  });
 }
 activate(list[list.length-1].id);
 toast(mode==='tile'&&actualMode==='cascade'?'螢幕空間不足，已改為視窗層疊':actualMode==='tile'?'已將視窗並排':'已將視窗層疊');
}

function noteFileName(w){return w?.arg||'個人筆記.txt'}
function savedNoteText(name){return files.find(f=>f.name===name)?.content||''}
function noteDraftText(name){return Object.prototype.hasOwnProperty.call(noteDrafts,name)?noteDrafts[name]:savedNoteText(name)}
function noteIsDirty(w){return !!w&&w.app==='notepad'&&noteDraftText(noteFileName(w))!==savedNoteText(noteFileName(w))}
function saveNoteDraft(w){
 if(!w||w.app!=='notepad')return false;
 const name=noteFileName(w), content=noteDraftText(name);
 const found=files.find(f=>f.name===name);
 if(found)found.content=content;else files.push({name,content});
 store(KEYS.files,files);delete noteDrafts[name];
 const el=document.querySelector(`#win-${CSS.escape(w.id)} [data-note-status]`);

 return true;
}

function parseYoutubeVideo(input){
 const raw=String(input||'').trim();
 if(!raw||raw.length>2048)return null;
 if(/^[A-Za-z0-9_-]{11}$/.test(raw))return {id:raw,start:0};
 let u;
 try{u=new URL(raw)}catch{return null}
 if(u.protocol!=='https:'&&u.protocol!=='http:')return null;
 const host=u.hostname.toLowerCase();
 let id='';
 if(host==='youtu.be'||host==='www.youtu.be')id=u.pathname.split('/')[1]||'';
 else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)){
  const parts=u.pathname.split('/').filter(Boolean);
  if(parts[0]==='watch')id=u.searchParams.get('v')||'';
  else if(['shorts','live','embed','v'].includes(parts[0]))id=parts[1]||'';
 }else return null;
 if(!/^[A-Za-z0-9_-]{11}$/.test(id))return null;
 // 支援官方分享網址常見的秒數、1m30s 及 1h2m3s 格式。
 const time=u.searchParams.get('t')||u.searchParams.get('start')||u.searchParams.get('time_continue')||'0';
 let start=0;
 if(/^\d+$/.test(time))start=Number(time);
 else if(/^(?:(?:\d+)h)?(?:(?:\d+)m)?(?:(?:\d+)s)?$/i.test(time)&&/\d/.test(time)){
  const h=/(\d+)h/i.exec(time),m=/(\d+)m/i.exec(time),sec=/(\d+)s/i.exec(time);
  start=(h?Number(h[1])*3600:0)+(m?Number(m[1])*60:0)+(sec?Number(sec[1]):0);
 }
 return {id,start:Number.isFinite(start)?Math.min(86400,Math.max(0,Math.floor(start))):0};
}

   draft={value:oldInput.value,focused:document.activeElement===oldInput,start:oldInput.selectionStart,end:oldInput.selectionEnd};

  const input=document.querySelector(`#win-${CSS.escape(w.id)} [data-chat-form] input`);

   input.value=draft.value;

// 待命是暫停模擬電腦，不應丟掉已送出但尚未到達的好友回覆。
// 只在同一次開機、同一次 YIQI Talk 登入中送達；重新開機與登出會使舊回覆失效。
function completeTalkReply(id,input,session,seq,kind='message'){
 if(epoch!==session||!ymSession.signedIn||ymSession.seq!==seq)return;
 if(state==='standby'){
  deferredTalkReplies.push({id,input,session,seq,kind});
  return;
 }
 if(state!=='desktop')return;
 if(kind==='message'){
  // Several messages may be awaiting separate simulated replies at the same time.
  // Keep the typing indicator until the last outstanding reply is delivered.
  talkPendingReplies[id]=Math.max(0,(talkPendingReplies[id]||1)-1);
  talkTyping[id]=talkPendingReplies[id]>0;
 }
 const typing=document.querySelector(`#win-chat_${CSS.escape(id)} [data-ytalk-typing]`);
 if(typing&&kind==='message')typing.hidden=!talkTyping[id];
 if(!buddies.some(b=>b.id===id)||ignoredFriends.has(id))return;
 const reply=kind==='nudge'?'我來了我來了🏃 再震就要腦震盪了🥹':botReply(id,input);
 addChat(id,'bot',reply,kind==='nudge');
}
function resumeDeferredTalkReplies(){
 const queue=deferredTalkReplies.splice(0);
 for(const item of queue)completeTalkReply(item.id,item.input,item.session,item.seq,item.kind);
}
function sendMessage(id,value){
 const txt=value.trim();if(!txt||!ymSession.signedIn)return;
 const session=epoch,seq=ymSession.seq;
 addChat(id,'me',txt);chirp(700,.07);
 talkPendingReplies[id]=(talkPendingReplies[id]||0)+1;
 talkTyping[id]=true;
 const typing=document.querySelector(`#win-chat_${CSS.escape(id)} [data-ytalk-typing]`);
 if(typing)typing.hidden=false;
 setTimeout(()=>completeTalkReply(id,txt,session,seq),650+Math.min(txt.length*28,850));
}

const activeMusicOscillators=new Set();
function synthMusicNote(hz, duration, wave, loudness){
 if(!hz||!canSound('music'))return;
 try{
  const ctx=getAudioContext();if(!ctx)return;
  const osc=ctx.createOscillator(),gain=ctx.createGain();
  const start=ctx.currentTime, release=Math.max(.08,duration*.89);
  osc.type=wave;osc.frequency.setValueAtTime(hz,start);
  gain.gain.setValueAtTime(.0001,start);
  gain.gain.linearRampToValueAtTime(loudness*(cfg.volume/65),start+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,start+release);
  osc.connect(gain);gain.connect(ctx.destination);
  activeMusicOscillators.add(osc);
  osc.onended=()=>{activeMusicOscillators.delete(osc);try{osc.disconnect();gain.disconnect()}catch(e){}};
  osc.start(start);osc.stop(start+release+.03);
 }catch(e){}
}
function stopMusic(){
 if(melodyTimer!==null){clearTimeout(melodyTimer);melodyTimer=null}
 for(const osc of activeMusicOscillators){try{osc.stop()}catch(e){}}
 activeMusicOscillators.clear();
 updatePlayerUI();
}
function updatePlayerUI(){
 const btn=$('#player-toggle'),disc=$('#player-disc'),sel=$('#player-track');
 const info=$('#player-track-style'),status=$('#player-status');
 if(btn)btn.textContent=melodyTimer!==null?'⏸ 暫停':'▶ 播放';
 if(disc)disc.classList.toggle('spinning',melodyTimer!==null);
 if(sel)sel.value=String(melodyTrack);
 if(info)info.textContent=songs[melodyTrack].style;
 if(status)status.textContent=melodyTimer!==null?'正在播放：'+songs[melodyTrack].name:'目前曲目：'+songs[melodyTrack].name+'（已暫停）';
}
function playMusic(){
 if(melodyTimer!==null){stopMusic();return}
 melodyIndex=0;
 function playStep(){
  const track=songs[melodyTrack];
  const [hz,beats]=track.notes[melodyIndex%track.notes.length];
  // 各曲使用不同拍長，換曲後立刻從第一個音重新開始。
  const milliseconds=60000/track.bpm*beats;
  if(hz){
   synthMusicNote(hz,Math.max(.085,milliseconds/1000-.035),track.wave,track.level);
   // 緩慢旋律加入低音襯底，與快節奏 8-bit 音色有明顯區別。
   if(track.bpm<=116&&melodyIndex%4===0)synthMusicNote(hz/2,Math.min(1.1,milliseconds/1000*1.3),'sine',track.level*.30);
  }
  melodyIndex++;
  melodyTimer=setTimeout(playStep,milliseconds);
 }
 playStep();updatePlayerUI();
}
function selectMusicTrack(index){

 if(wasPlaying)playMusic();
 else updatePlayerUI();
}

 let holding=false,moved=false,cancelled=false;
 const timer=setTimeout(()=>{if(cancelled)return;holding=true;icon.classList.add('moving');try{icon.setPointerCapture(e.pointerId)}catch{}},220);
 function move(ev){
  const dx=ev.clientX-sx,dy=ev.clientY-sy;
  if(!holding){if(Math.abs(dx)+Math.abs(dy)>15){cancelled=true;clearTimeout(timer)}return}
  moved=true;
  const x=Math.max(0,Math.min(ws.clientWidth-icon.offsetWidth,pos.x+dx));
  const y=Math.max(0,Math.min(ws.clientHeight-icon.offsetHeight,pos.y+dy));
  desktopIconPositions[id]={x,y};icon.style.left=x+'px';icon.style.top=y+'px';
 }
 function end(){clearTimeout(timer);icon.classList.remove('moving');if(holding){suppressIconClick=true;setTimeout(()=>{suppressIconClick=false},400)}icon.removeEventListener('pointermove',move);icon.removeEventListener('pointerup',end);icon.removeEventListener('pointercancel',end)}
 icon.addEventListener('pointermove',move);icon.addEventListener('pointerup',end);icon.addEventListener('pointercancel',end);
});
app.addEventListener('pointerdown',e=>{if(state!=='desktop')return;const grip=e.target.closest('[data-resize]');
 if(grip){
  if(e.button!==0&&e.pointerType!=='touch')return;
  const w=wins.find(v=>v.id===grip.dataset.resize);if(!w||w.maximized)return;
  const el=document.getElementById('win-'+w.id),ws=$('#desktop-workspace');if(!el||!ws)return;
  activate(w.id);e.preventDefault();
  const rect=el.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=rect.width,oy=rect.height;
  const maxW=Math.max(280,Math.min(ws.clientWidth-w.x,innerWidth)),maxH=Math.max(180,ws.clientHeight-w.y);
  try{grip.setPointerCapture(e.pointerId)}catch{}
  function move(ev){w.width=Math.max(280,Math.min(maxW,ox+ev.clientX-sx));w.height=Math.max(180,Math.min(maxH,oy+ev.clientY-sy));w.customSize=true;
   el.style.width=w.width+'px';el.style.height=w.height+'px';el.style.setProperty('--win-width',w.width+'px');el.style.setProperty('--win-height',w.height+'px')}
  function up(){grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up)}
  grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);return;
 }
 const bar=e.target.closest('[data-drag]');if(!bar||e.target.closest('.win-actions'))return;
 const id=bar.dataset.drag,w=wins.find(v=>v.id===id);if(!w||w.maximized)return;
 const el=document.getElementById('win-'+id),ws=$('#desktop-workspace');if(!el||!ws)return;
 activate(id);e.preventDefault();
 const sx=e.clientX,sy=e.clientY,ox=parseFloat(getComputedStyle(el).left)||0,oy=parseFloat(getComputedStyle(el).top)||0;
 try{bar.setPointerCapture(e.pointerId)}catch{}
 function move(ev){w.x=Math.max(0,Math.min(ws.clientWidth-100,ox+ev.clientX-sx));w.y=Math.max(0,Math.min(ws.clientHeight-65,oy+ev.clientY-sy));w.customPlacement=true;
  el.style.left=w.x+'px';el.style.top=w.y+'px';el.style.setProperty('--win-left',w.x+'px');el.style.setProperty('--win-top',w.y+'px')}
 function up(){bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up)}
 bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up)});
app.addEventListener('dblclick',e=>{if(e.target.closest('.titlebar')&&!e.target.closest('.win-actions')){const id=e.target.closest('.window')?.id.slice(4);if(id)windowAction('max',id)}});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(noteClosePendingId){noteClosePendingId=null;renderDialog()}else if(powerDialog){powerWarningMode=null;powerDialog=false;renderDialog()}else if(showStart){showStart=false;renderStart()}}});
powerOffScreen();
})();
</script>
</body></html>
