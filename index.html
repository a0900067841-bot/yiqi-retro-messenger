function scrollChat(id){const b=id.startsWith('chat_')?id.slice(5):id;const el=document.getElementById('log-'+b);if(el)el.scrollTop=el.scrollHeight}
function addChat(id,who,text){const b=buddies.find(x=>x.id===id);if(!b)return;const history=chats[id]||[{who:'bot',text:b.intro,time:dateTime()}];history.push({who,text:String(text).slice(0,450),time:dateTime()});chats[id]=history.slice(-100);store(KEYS.chat,chats);refresh(wins.find(x=>x.id==='chat_'+id))}
function botReply(id,text){const msg=text.trim();if(/(嗨|哈囉|你好|安安|hi|hello)/i.test(msg))return '嗨嗨！好久不見～還記得以前的聊天室嗎？ 😄';if(/(時間|幾點)/.test(msg))return '現在是 '+dateTime()+'，懷舊時間過得真快！';if(/(開機|關機|XP)/i.test(msg))return '開始選單裡可以關機、重新開機和待命，記得試試看！';if(/(音樂|聽歌)/.test(msg))return '桌面上有音樂播放器，點開就能聽原創懷舊旋律 🎵';if(/(謝謝|感謝)/.test(msg))return '不客氣～我們下次見！';const replies=['叮咚！收到你的訊息了～ 🔔','真的嗎？好有以前 MSN 的感覺！','哈哈，我也這麼覺得 😆','今天的桌面很懷舊呢！','這裡是虛擬聊天室，但回憶是真的 ✨','好耶～繼續聊天吧！'];return replies[(msg.length+id.length+chats[id].length)%replies.length]}
function sendMessage(id,value){const txt=value.trim();if(!txt)return;const session=epoch;addChat(id,'me',txt);chirp(700,.07);setTimeout(()=>{if(state!=='desktop'||epoch!==session)return;if(state!=='desktop')return;addChat(id,'bot',botReply(id,txt));chirp(930,.08);},650+Math.min(txt.length*28,850))}
function setupCanvas(w){const c=document.getElementById('paint-canvas');if(!c||w.app!=='paint')return;const rect=c.getBoundingClientRect();if(rect.width<1||rect.height<1)return;c.width=Math.max(320,Math.round(rect.width));c.height=Math.max(200,Math.round(rect.height));const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);let drawing=false;function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.01,p.y+.01);ctx.strokeStyle=$('#paint-color')?.value||'#2b60c0';ctx.lineWidth=Number($('#paint-size')?.value||4);ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()});c.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()});c.addEventListener('pointerup',()=>drawing=false);c.addEventListener('pointercancel',()=>drawing=false)}
const songs=[[392,440,523,587,523,440,392,330,392,523,587,659,587,523,440,392],[330,392,494,392,587,494,392,330,294,330,392,494,440,392,330,262],[262,330,392,349,330,294,262,220,262,294,349,392,349,330,294,262]];
function stopMusic(){if(melodyTimer){clearInterval(melodyTimer);melodyTimer=null}updatePlayerUI()}
function updatePlayerUI(){const btn=$('#player-toggle'),disc=$('#player-disc'),sel=$('#player-track');if(btn)btn.textContent=melodyTimer?'⏸ 暫停':'▶ 播放';if(disc)disc.classList.toggle('spinning',!!melodyTimer);if(sel)sel.value=String(melodyTrack)}
function playMusic(){if(melodyTimer){stopMusic();return}melodyIndex=0;function note(){chirp(songs[melodyTrack][melodyIndex++%songs[melodyTrack].length],.3,'sine',.024)}note();melodyTimer=setInterval(note,370);updatePlayerUI()}
let calcState={display:'0',a:null,op:null,fresh:false};function calcPress(x){let s=calcState;if(x==='C'){calcState={display:'0',a:null,op:null,fresh:false};s=calcState}else if(x==='←'){s.display=s.display.length>1?s.display.slice(0,-1):'0'}else if(/[0-9]/.test(x)&&x.length===1){s.display=(s.fresh||s.display==='0')?x:s.display+x;s.fresh=false}else if(x==='.'){if(s.fresh){s.display='0';s.fresh=false}if(!s.display.includes('.'))s.display+='.'}else if(x==='±'){s.display=String(-Number(s.display))}else if(x==='%'){s.display=String(Number(s.display)/100)}else if(['+','−','×','÷'].includes(x)){if(s.a!==null&&s.op&&!s.fresh)calcPress('=');s.a=Number(s.display);s.op=x;s.fresh=true}else if(x==='='){if(s.a!==null&&s.op){const b=Number(s.display),res=({'+':()=>s.a+b,'−':()=>s.a-b,'×':()=>s.a*b,'÷':()=>b===0?NaN:s.a/b})[s.op]();s.display=Number.isFinite(res)?String(Number(res.toFixed(9))):'錯誤';s.a=null;s.op=null;s.fresh=true}}const el=$('#calc-display');if(el)el.textContent=s.display}
function action(name,el){switch(name){case 'saveNote':{const text=el.closest('.window')?.querySelector('[data-note-edit]');if(!text)return;const file=text.getAttribute('data-note-edit');const curr=files.find(f=>f.name===file);if(curr)curr.content=text.value;else files.push({name:file,content:text.value});store(KEYS.files,files);toast('已暫存：'+file+'（重新開機會還原）');break}case 'newNote':{const wanted=prompt('新文件名稱（不需要輸入副檔名）','我的筆記');if(wanted===null)return;let name=wanted.trim().replace(/[\\/:*?"<>|]/g,'').slice(0,40);if(!name){toast('請輸入有效的名稱');return}if(!name.endsWith('.txt'))name+='.txt';if(files.some(f=>f.name===name)){toast('已有相同名稱的文件');return}files.push({name,content:''});store(KEYS.files,files);const d=wins.find(x=>x.id==='documents');if(d)refresh(d);openWin('notepad',name);break}case 'saveName':{const name=$('#username-input')?.value?.trim();if(!name)return toast('名稱不可空白');cfg.name=name.slice(0,22);saveSettings();refresh(wins.find(x=>x.app==='messenger'));toast('已暫時修改名稱（重新開機會還原）');break}case 'goComputer':openWin('explorer');break;case 'goDocuments':openWin('documents');break;case 'emptyBin':if(!bin.length)return;if(confirm('確定要清空模擬資源回收筒嗎？')){bin=[];store(KEYS.bin,bin);refresh(wins.find(x=>x.id==='bin'));toast('已清空；重新開機仍會恢復預設檔案')}break;case 'fakeDrive':toast('這是模擬磁碟，沒有存取裝置真實 C 槽或 D 槽。');break;case 'emote':{const id=el.dataset.chatId;const inp=document.querySelector(`[data-chat-form="${id}"] input`);if(inp){inp.value+='😊';inp.focus()}break}case 'nudge':{const id='chat_'+el.dataset.chatId;const win=document.getElementById('win-'+id);win?.classList.remove('shake');void win?.offsetWidth;win?.classList.add('shake');chirp(780,.07);setTimeout(()=>chirp(1010,.16),110);toast('已發送模擬震動！');break}case 'clearChat':{const id=el.dataset.chatId;if(confirm('清除這個虛擬好友的本機模擬聊天紀錄？')){delete chats[id];store(KEYS.chat,chats);refresh(wins.find(x=>x.id==='chat_'+id))}break}case 'paintClear':{const c=$('#paint-canvas');if(c){const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)}break}case 'paintSave':{const c=$('#paint-canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='億柒小畫家.png';a.click();toast('圖片已交由瀏覽器下載（手機可查看下載項目）');break}case 'toggleMusic':playMusic();break;case 'nextTrack':case 'prevTrack':melodyTrack=(melodyTrack+(name==='nextTrack'?1:2))%3;melodyIndex=0;updatePlayerUI();break;case 'fakeHome':{$('#fake-url').value='yiqi://welcome';$('#browser-output').textContent='歡迎回到億柒首頁！這是網頁內的模擬瀏覽器。';break}case 'fakeHelp':{$('#fake-url').value='yiqi://help';$('#browser-output').textContent='小提示：桌面圖示可以開啟程式；按開始選單可以關機、登出與重新開機。';break}case 'browse':{const url=$('#fake-url')?.value?.trim()||'';if(/^https?:\/\//i.test(url)){window.open(url,'_blank','noopener,noreferrer');$('#browser-output').textContent='已嘗試以新分頁開啟網址；可能被瀏覽器阻擋。'}else $('#browser-output').textContent='模擬瀏覽器只支援 yiqi:// 頁面；真實網頁請輸入完整 https:// 網址。';break}}}
app.addEventListener('click',e=>{const global=e.target.closest('[data-global]');if(global){const g=global.dataset.global;if(g==='poweron')boot();else if(g==='skipboot')showWelcome();else if(g==='login')login();else if(g==='wake')renderDesktop();else if(g==='start'){showStart=!showStart;renderStart();chirp(770,.04)}else if(g==='powerdialog'){showStart=false;renderStart();powerDialog=true;renderDialog()}else if(g==='canceldialog'){powerDialog=false;renderDialog()}else if(g==='shutdown')shutdown('shutdown');else if(g==='restart')shutdown('restart');else if(g==='standby')shutdown('standby');else if(g==='logout')shutdown('logout');return}
const winbutton=e.target.closest('[data-win]');if(winbutton){windowAction(winbutton.dataset.win,winbutton.dataset.id);return}const task=e.target.closest('[data-task]');if(task){toggleTask(task.dataset.task);return}const open=e.target.closest('[data-open]');if(open){openWin(open.dataset.open);return}const chat=e.target.closest('[data-chat]');if(chat){openWin('chat',chat.dataset.chat);return}const file=e.target.closest('[data-file]');if(file){openWin('notepad',file.dataset.file);return}const del=e.target.closest('[data-delete]');if(del){const name=del.dataset.delete;const i=files.findIndex(f=>f.name===name);if(i>=0){bin.push(files.splice(i,1)[0]);store(KEYS.files,files);store(KEYS.bin,bin);refresh(wins.find(x=>x.id==='documents'));toast('已移到資源回收筒；重新開機會恢復原始檔案')}return}const restore=e.target.closest('[data-restore]');if(restore){const i=Number(restore.dataset.restore);if(bin[i]){if(files.some(f=>f.name===bin[i].name))return toast('文件名稱重複，無法還原');files.push(bin.splice(i,1)[0]);store(KEYS.files,files);store(KEYS.bin,bin);refresh(wins.find(x=>x.id==='bin'));toast('已還原文件')}return}const wall=e.target.closest('[data-wallpaper]');if(wall){cfg.wallpaper=wall.dataset.wallpaper;saveSettings();$('#desktop').className='desktop wallpaper-'+cfg.wallpaper;refresh(wins.find(x=>x.id==='settings'));return}const calc=e.target.closest('[data-calc]');if(calc){calcPress(calc.dataset.calc);return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action,a);return}
const w=e.target.closest('.window');if(w)activate(w.id.replace(/^win-/,''));else if(showStart&&!e.target.closest('.start-menu')){showStart=false;renderStart()}});
app.addEventListener('submit',e=>{const form=e.target.closest('[data-chat-form]');if(!form)return;e.preventDefault();const inp=form.querySelector('input');sendMessage(form.dataset.chatForm,inp.value);inp.value='';inp.focus()});
app.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-note-edit]')){const name=t.getAttribute('data-note-edit');const found=files.find(f=>f.name===name);if(found)found.content=t.value;else files.push({name,content:t.value});store(KEYS.files,files);}});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.setting){cfg[t.dataset.setting]=!!t.checked;saveSettings();toast('設定已套用（重新開機會還原）')}if(t.id==='player-track'){melodyTrack=Number(t.value);melodyIndex=0;updatePlayerUI()}});
app.addEventListener('pointerdown',e=>{if(state!=='desktop')return;const bar=e.target.closest('[data-drag]');if(!bar||e.target.closest('.win-actions'))return;const id=bar.dataset.drag,w=wins.find(v=>v.id===id);if(!w)return;activate(id);if(w.maximized||innerWidth<=700)return;const el=document.getElementById('win-'+id);const sx=e.clientX,sy=e.clientY,ox=w.x,oy=w.y;bar.setPointerCapture(e.pointerId);function move(ev){w.x=Math.max(0,Math.min(innerWidth-100,ox+ev.clientX-sx));w.y=Math.max(0,Math.min(innerHeight-100,oy+ev.clientY-sy));el.style.left=w.x+'px';el.style.top=w.y+'px'}function up(){bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up)}bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up)});
app.addEventListener('dblclick',e=>{if(e.target.closest('.titlebar')&&!e.target.closest('.win-actions')){const id=e.target.closest('.window')?.id.slice(4);if(id)windowAction('max',id)}});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(powerDialog){powerDialog=false;renderDialog()}else if(showStart){showStart=false;renderStart()}}});
powerOffScreen();
})();
