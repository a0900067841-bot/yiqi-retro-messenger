function noteFileName(w){return w?.arg||'個人筆記.txt'}
function savedNoteText(name){return files.find(f=>f.name===name)?.content||''}
function noteDraftText(name){return Object.prototype.hasOwnProperty.call(noteDrafts,name)?noteDrafts[name]:savedNoteText(name)}
function noteIsDirty(w){return !!w&&w.app==='notepad'&&noteDraftText(noteFileName(w))!==savedNoteText(noteFileName(w))}
function saveNoteDraft(w){
 if(!w||w.app!=='notepad')return false;
 const name=noteFileName(w), content=noteDraftText(name);
 const found=files.find(f=>f.name===name);
 if(found)found.content=content;else files.push({name,content});
 store(KEYS.files,files);delete noteDrafts[name];
 const el=document.querySelector(`#win-${CSS.escape(w.id)} [data-note-status]`);
 if(el)el.textContent='已儲存（本次模擬開機）';
 return true;
}
function updateNoteStatus(w){
 if(!w||w.app!=='notepad')return;
 const status=document.querySelector(`#win-${CSS.escape(w.id)} [data-note-status]`);

 if(id==='messenger'){
  // 使用者在登入動畫尚未結束就關閉視窗時，不應在背景偷偷登入。
  if(ymSession.pending){ymSession.seq++;ymSession.pending=false;}

   for(const chat of wins.filter(w=>w.app==='chat')){document.getElementById('win-'+chat.id)?.remove()}
   wins=wins.filter(w=>w.app!=='chat');
  }
 }
 wins=wins.filter(w=>w.id!==id);document.getElementById('win-'+id)?.remove();if(id==='player')stopMusic();if(activeId===id)activeId=wins.length?wins[wins.length-1].id:null;if(activeId)activate(activeId);else renderTasks()}

function mockYmSignIn(form){
 if(ymSession.pending||state!=='desktop')return;
 const name=(form.elements.mockAccount.value||'').trim();
 if(!name){form.querySelector('#ym-id')?.focus();return;}
 ymSession.remember=!!form.elements.remember.checked;
 ymSession.remembered=ymSession.remember?name:'';
 ymSession.auto=!!form.elements.auto.checked;
 ymSession.invisible=!!form.elements.invisible.checked;
 ymSession.presence=ymSession.invisible?'invisible':'online';
 ymSession.pending=true;
 const w=wins.find(w=>w.app==='messenger');refresh(w);
 const session=epoch, token=++ymSession.seq;
 // 模擬登入的延遲是介面動畫，不進行任何網路請求。
 setTimeout(()=>{

 },800);
}

function parseYoutubeVideo(input){
 const raw=String(input||'').trim();
 if(!raw||raw.length>2048)return null;
 if(/^[A-Za-z0-9_-]{11}$/.test(raw))return {id:raw,start:0};
 let u;
 try{u=new URL(raw)}catch{return null}
 if(u.protocol!=='https:'&&u.protocol!=='http:')return null;
 const host=u.hostname.toLowerCase();
 let id='';
 if(host==='youtu.be'||host==='www.youtu.be')id=u.pathname.split('/')[1]||'';
 else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(host)){
  const parts=u.pathname.split('/').filter(Boolean);
  if(parts[0]==='watch')id=u.searchParams.get('v')||'';
  else if(['shorts','live','embed','v'].includes(parts[0]))id=parts[1]||'';
 }else return null;
 if(!/^[A-Za-z0-9_-]{11}$/.test(id))return null;
 // 支援官方分享網址常見的秒數、1m30s 及 1h2m3s 格式。
 const time=u.searchParams.get('t')||u.searchParams.get('start')||u.searchParams.get('time_continue')||'0';
 let start=0;
 if(/^\d+$/.test(time))start=Number(time);
 else if(/^(?:(?:\d+)h)?(?:(?:\d+)m)?(?:(?:\d+)s)?$/i.test(time)&&/\d/.test(time)){
  const h=/(\d+)h/i.exec(time),m=/(\d+)m/i.exec(time),sec=/(\d+)s/i.exec(time);
  start=(h?Number(h[1])*3600:0)+(m?Number(m[1])*60:0)+(sec?Number(sec[1]):0);
 }
 return {id,start:Number.isFinite(start)?Math.min(86400,Math.max(0,Math.floor(start))):0};
}

function synthMusicNote(hz, duration, wave, loudness){

}

let calcState={display:'0',a:null,op:null,fresh:false};function calcPress(x){let s=calcState;if(x==='C'){calcState={display:'0',a:null,op:null,fresh:false};s=calcState}else if(x==='←'){s.display=s.display.length>1?s.display.slice(0,-1):'0'}else if(/[0-9]/.test(x)&&x.length===1){s.display=(s.fresh||s.display==='0')?x:s.display+x;s.fresh=false}else if(x==='.'){if(s.fresh){s.display='0';s.fresh=false}if(!s.display.includes('.'))s.display+='.'}else if(x==='±'){s.display=String(-Number(s.display))}else if(x==='%'){s.display=String(Number(s.display)/100)}else if(['+','−','×','÷'].includes(x)){if(s.a!==null&&s.op&&!s.fresh)calcPress('=');s.a=Number(s.display);s.op=x;s.fresh=true}else if(x==='='){if(s.a!==null&&s.op){const b=Number(s.display),res=({'+':()=>s.a+b,'−':()=>s.a-b,'×':()=>s.a*b,'÷':()=>b===0?NaN:s.a/b})[s.op]();s.display=Number.isFinite(res)?String(Number(res.toFixed(9))):'錯誤';s.a=null;s.op=null;s.fresh=true}}const el=$('#calc-display');if(el)el.textContent=s.display}

k}case 'clearChat':{const id=el.dataset.chatId;if(confirm('清除這個虛擬好友的本機模擬聊天紀錄？')){delete chats[id];store(KEYS.chat,chats);refresh(wins.find(x=>x.id==='chat_'+id))}break}case 'paintClear':{const c=$('#paint-canvas');if(c){const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)}break}case 'paintSave':{const c=$('#paint-canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='億柒小畫家.png';a.click();toast('圖片已交由瀏覽器下載（手機可查看下載項目）');break}case 'toggleMusic':playMusic();break;case 'nextTrack':case 'prevTrack':selectMusicTrack(melodyTrack+(name==='nextTrack'?1:songs.length-1));break;case 'fakeHome':{$('#fake-url').value='yiqi://welcome';$('#browser-output').textContent='歡迎回到億柒首頁！這是網頁內的模擬瀏覽器。';break}case 'fakeHelp':{$('#fake-url').value='yiqi://help';$('#browser-output').textContent='小提示：桌面圖示可以開啟程式；按開始選單可以關機、登出與重新開機。';break}case 'browse':{const url=$('#fake-url')?.value?.trim()||'';if(/^https?:\/\//i.test(url)){window.open(url,'_blank','noopener,noreferrer');$('#browser-output').textContent='已嘗試以新分頁開啟網址；可能被瀏覽器阻擋。'}else $('#browser-output').textContent='模擬瀏覽器只支援 yiqi:// 頁面；真實網頁請輸入完整 https:// 網址。';break}}}
app.addEventListener('click',e=>{const global=e.target.closest('[data-global]');if(global){const g=global.dataset.global;if(g==='poweron')boot();else if(g==='skipboot')showWelcome();else if(g==='login')login();else if(g==='wake'){const overlay=$('#standby-overlay');if(overlay){overlay.remove();state='desktop';const rotated=standbyViewport&&(standbyViewport.width!==innerWidth||standbyViewport.height!==innerHeight);standbyViewport=null;if(rotated)fitExistingWindowsToViewport();lastDesktopViewportWidth=innerWidth;syncMaximizedWindowsToDesktopScroll();}else renderDesktop();resumeDeferredTalkReplies();}else if(g==='start'){volumeOpen=false;windowToolsOpen=false;renderWindowTools();renderVolumePanel();showStart=!showStart;renderStart();chirp(770,.04)}else if(g==='volume'){volumeOpen=!volumeOpen;windowToolsOpen=false;renderWindowTools();showStart=false;renderStart();renderVolumePanel()}else if(g==='windowtools'){windowToolsOpen=!windowToolsOpen;volumeOpen=false;showStart=false;renderStart();renderVolumePanel();renderWindowTools()}else if(g==='arrangecascade'||g==='arrangetile'||g==='showdesktop'||g==='restorewindows'||g==='resetwindows'){windowToolsOpen=false;renderWindowTools();if(g==='arrangecascade')arrangeWindows('cascade');else if(g==='arrangetile')arrangeWindows('tile');else if(g==='showdesktop')showDesktopWindows();else if(g==='restorewindows')restoreDesktopWindows();else resetDesktopWindowSizes()}else if(g==='voltest'){playPowerSound('startup',true)}else if(g==='teststartup'){playPowerSound('startup',true)}else if(g==='testshutdown'){playPowerSound('shutdown',true)}else if(g==='testtalkmessage'){playTalkMessageSound(true)}else if(g==='powerdialog'){showStart=false;renderStart();powerWarningMode=null;powerDialog=true;renderDialog()}else if(g==='noteclosecancel'){noteClosePendingId=null;renderDialog()}
 else if(g==='noteclosesave'||g==='noteclosediscard'){
  const id=noteClosePendingId,w=wins.find(w=>w.id===id);
  if(g==='noteclosesave'&&w)saveNoteDraft(w);
  noteClosePendingId=null;renderDialog();

 }else if(g==='canceldialog'||g==='cancelshutdownwarning'){powerWarningMode=null;powerDialog=false;renderDialog()}else if(g==='confirmshutdownwarning'){const mode=powerWarningMode;powerWarningMode=null;if(mode==='shutdown'||mode==='restart'||mode==='logout')shutdown(mode)}else if(g==='shutdown')requestShutdown('shutdown');else if(g==='restart')requestShutdown('restart');else if(g==='standby')shutdown('standby');else if(g==='logout')requestShutdown('logout');return}
const ymSignout=e.target.closest('[data-ym-signout]');if(ymSignout){mockYmSignOut();return}

if(e.target.closest('[data-shortcut]')&&suppressIconClick){suppressIconClick=false;return}
const winbutton=e.target.closest('[data-win]');if(winbutton){windowAction(winbutton.dataset.win,winbutton.dataset.id);return}const task=e.target.closest('[data-task]');if(task){toggleTask(task.dataset.task);return}const open=e.target.closest('[data-open]');if(open){openWin(open.dataset.open);return}const chat=e.target.closest('[data-chat]');if(chat){openWin('chat',chat.dataset.chat);alerts=alerts.filter(n=>n.friendId!==chat.dataset.chat||n.kind==='invite');renderAlerts();return}const file=e.target.closest('[data-file]');if(file){openWin('notepad',file.dataset.file);return}const del=e.target.closest('[data-delete]');if(del){const name=del.dataset.delete;const i=files.findIndex(f=>f.name===name);if(i>=0){bin.push(files.splice(i,1)[0]);store(KEYS.files,files);store(KEYS.bin,bin);refresh(wins.find(x=>x.id==='documents'));toast('已移到資源回收筒；重新開機會恢復原始檔案')}return}const restore=e.target.closest('[data-restore]');if(restore){const i=Number(restore.dataset.restore);if(bin[i]){if(files.some(f=>f.name===bin[i].name))return toast('文件名稱重複，無法還原');files.push(bin.splice(i,1)[0]);store(KEYS.files,files);store(KEYS.bin,bin);refresh(wins.find(x=>x.id==='bin'));toast('已還原文件')}return}const wall=e.target.closest('[data-wallpaper]');if(wall){cfg.wallpaper=wall.dataset.wallpaper;saveSettings();$('#desktop').className='desktop wallpaper-'+cfg.wallpaper;refresh(wins.find(x=>x.id==='settings'));return}const calc=e.target.closest('[data-calc]');if(calc){calcPress(calc.dataset.calc);return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action,a);return}
const w=e.target.closest('.window');if(w)activate(w.id.replace(/^win-/,''));else if(showStart&&!e.target.closest('.start-menu')){showStart=false;renderStart()}if(volumeOpen&&!e.target.closest('.volume-popover')&&!e.target.closest('.tray-speaker')){volumeOpen=false;renderVolumePanel()}if(windowToolsOpen&&!e.target.closest('.window-tools-panel')&&!e.target.closest('.window-tools-btn')){windowToolsOpen=false;renderWindowTools()}});
app.addEventListener('submit',e=>{
 const ytForm=e.target.closest('[data-yt-form]');if(ytForm){e.preventDefault();loadYoutubeVideo(ytForm);return;}
 const loginForm=e.target.closest('[data-ym-login]');
 if(loginForm){e.preventDefault();mockYmSignIn(loginForm);return;}
 const form=e.target.closest('[data-chat-form]');if(!form)return;e.preventDefault();const inp=form.querySelector('input');const message=inp.value;inp.value='';sendMessage(form.dataset.chatForm,message);const visible=document.querySelector(`[data-chat-form="${form.dataset.chatForm}"] input`);if(visible)visible.focus()});
app.addEventListener('input',e=>{const t=e.target;if(t.id==='ytalk-friend-search'){filterTalkFriends(t.value);return}if(t.id==='master-volume'){cfg.volume=Math.min(100,Math.max(0,Number(t.value)||0));saveSettings();$('#volume-value').textContent=cfg.volume+'%';const speaker=$('.tray-speaker');if(speaker)speaker.textContent=cfg.muted||cfg.volume===0?'🔇':cfg.volume<40?'🔉':'🔊';return}if(t.matches('[data-note-edit]')){const name=t.getAttribute('data-note-edit');noteDrafts[name]=t.value;const w=wins.find(w=>w.id===t.closest('.window')?.id.slice(4));updateNoteStatus(w);}});

app.addEventListener('pointerdown',e=>{
 if(state!=='desktop')return;
 const icon=e.target.closest('[data-shortcut]');if(!icon||e.button!==0)return;
 const ws=$('#desktop-workspace');if(!ws)return;
 // Begin dragging from the currently visible location, not an offscreen
 // portrait position that was temporarily clamped after rotation.
 const id=icon.dataset.shortcut,pos={x:parseFloat(icon.style.left)||0,y:parseFloat(icon.style.top)||0},sx=e.clientX,sy=e.clientY;
 let holding=false,moved=false,cancelled=false;
 const timer=setTimeout(()=>{if(cancelled)return;holding=true;icon.classList.add('moving');try{icon.setPointerCapture(e.pointerId)}catch{}},220);
 function move(ev){
  const dx=ev.clientX-sx,dy=ev.clientY-sy;
  if(!holding){if(Math.abs(dx)+Math.abs(dy)>15){cancelled=true;clearTimeout(timer)}return}
  moved=true;
  const x=Math.max(0,Math.min(ws.clientWidth-icon.offsetWidth,pos.x+dx));
  const y=Math.max(0,Math.min(ws.clientHeight-icon.offsetHeight,pos.y+dy));
  desktopIconPositions[id]={x,y};icon.style.left=x+'px';icon.style.top=y+'px';
 }
 function end(){clearTimeout(timer);icon.classList.remove('moving');if(holding){suppressIconClick=true;setTimeout(()=>{suppressIconClick=false},400)}icon.removeEventListener('pointermove',move);icon.removeEventListener('pointerup',end);icon.removeEventListener('pointercancel',end)}
 icon.addEventListener('pointermove',move);icon.addEventListener('pointerup',end);icon.addEventListener('pointercancel',end);
});
app.addEventListener('pointerdown',e=>{if(state!=='desktop')return;const grip=e.target.closest('[data-resize]');
 if(grip){
  if(e.button!==0&&e.pointerType!=='touch')return;
  const w=wins.find(v=>v.id===grip.dataset.resize);if(!w||w.maximized)return;
  const el=document.getElementById('win-'+w.id),ws=$('#desktop-workspace');if(!el||!ws)return;
  activate(w.id);e.preventDefault();
  const rect=el.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=rect.width,oy=rect.height;
  const maxW=Math.max(280,Math.min(ws.clientWidth-w.x,innerWidth)),maxH=Math.max(180,ws.clientHeight-w.y);
  try{grip.setPointerCapture(e.pointerId)}catch{}
  function move(ev){w.width=Math.max(280,Math.min(maxW,ox+ev.clientX-sx));w.height=Math.max(180,Math.min(maxH,oy+ev.clientY-sy));w.customSize=true;
   el.style.width=w.width+'px';el.style.height=w.height+'px';el.style.setProperty('--win-width',w.width+'px');el.style.setProperty('--win-height',w.height+'px')}
  function up(){grip.removeEventListener('pointermove',move);grip.removeEventListener('pointerup',up);grip.removeEventListener('pointercancel',up)}
  grip.addEventListener('pointermove',move);grip.addEventListener('pointerup',up);grip.addEventListener('pointercancel',up);return;
 }
 const bar=e.target.closest('[data-drag]');if(!bar||e.target.closest('.win-actions'))return;
 const id=bar.dataset.drag,w=wins.find(v=>v.id===id);if(!w||w.maximized)return;
 const el=document.getElementById('win-'+id),ws=$('#desktop-workspace');if(!el||!ws)return;
 activate(id);e.preventDefault();
 const sx=e.clientX,sy=e.clientY,ox=parseFloat(getComputedStyle(el).left)||0,oy=parseFloat(getComputedStyle(el).top)||0;
 try{bar.setPointerCapture(e.pointerId)}catch{}
 function move(ev){w.x=Math.max(0,Math.min(ws.clientWidth-100,ox+ev.clientX-sx));w.y=Math.max(0,Math.min(ws.clientHeight-65,oy+ev.clientY-sy));w.customPlacement=true;
  el.style.left=w.x+'px';el.style.top=w.y+'px';el.style.setProperty('--win-left',w.x+'px');el.style.setProperty('--win-top',w.y+'px')}
 function up(){bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up)}
 bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up)});
